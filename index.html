<body>
    <h1>Compound Intrest</h1>
    <script>
    let p = 1000;
let r = 12 / 100;
let n = 3;
let t = 12;

let a;

a = p * (1 + (r / n)) ** (n * t);

console.log("Amount:", a);
console.log("Compound Interest:", a - p);
        


    </script>
