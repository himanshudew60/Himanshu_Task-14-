<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Javascript DOM & Event Handling</title>
</head>

<body>

    <div class="container">


        <h2 id="greetbox">
            Hello &nbsp;
            <span id="greetName"></span>
        </h2>


        <div class="color-boxes">
            <button type="button" id="red">Red</button>
            <button type="button" id="blue">Blue</button>
            <button type="button" id="green">Green</button>
            <button type="button" id="yellow">Yellow</button>
</div>


        <div class="input-section">
            <input id="inputname" type="text" placeholder="Enter your name">

            <button type="button" id="button">Greet</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
