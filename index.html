<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Service Booking Web App</title>
</head>
<body>
    <div class="header">
        <h2>Logo</h2>
        <ul>
            <li>Home</li>
            <li>Services</li>
            <li>Contact Us</li>
            <li>About Us</li>
        </ul>
        <div class="btn">
            <span>Username</span>
            <button><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </div>
    <div class="container">
        <div class="left-box">
            <div class="add-item">
                <div class="add-item-head">
                    <h3>Add Item</h3>

                </div>
                <div class="add-item-body">
                    <div class="list-head">
                        
                            <div>S.No</div>
                            <div>Service Name</div>
                       
                        <div class="col-2">Price</div>
                    </div>
                    <div id="rows" class="list-body">
                       
                    </div>
                </div>
                <div class="add-item-footer">
                    <span class="total-amount-label">Total Amount</span>
                    <span class="total-amount"><i class="fa-solid fa-indian-rupee-sign"></i><span id="total-amount">00</span></span>
                </div>
            </div>
            <div class="book-now">
                <div class="book-now-head">
                    <h4>Book Now</h4>
                </div>
                <div class="book-now-body">
                    <div class="name-field">
                        <label for="">Full Name</label>
                        <input id="name" type="text" >
                    </div>
                    <div class="email-password">
                        <div class="email">
                            <label for="" >Email ID</label>
                            <input id="email" type="text">
                        </div>
                        <div  class="password">
                            <label for="">Password</label>
                            <input id="password" type="text">
                        </div>
                    </div>
                    <button class="book-now-btn" id="book-now">Book Now</button>
                    <div id="book-now-footer">
                       
                    </div>
                </div>
            </div>
        </div>
        <div class="right-box">
            <div class="r-box-head">
                <h3>Browse Our Services</h3>
                <p>Click on the add to cart button to add the service to your cart or press the skip</p>
            </div>
            <hr>
            <div class="r-box-body">
                <img id="service-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSal0IbnRyf02gfzQuq9S6zZpJJY2rJlZQxIVacHdHt6Q&s=10" alt="">
                <div class="name-price">
                    <span class="service-name" id="service-name">Dry Cleaning</span>
                    <span class="service-price"><i class="fa-solid fa-indian-rupee-sign"></i><span id="service-price">200</span></span>
                </div>
                <div class="skip-add-btn">
                    <button class="skip-btn" id="skip-btn">Skip <i class="fa-solid fa-circle-minus"></i></button>
                    <button class="add-btn" id="add-btn">Add to Cart <i class="fa-solid fa-circle-plus"></i></button>
                </div>
            </div>
            <hr>
            <div class="r-box-footer">
                <i class="fa-solid fa-circle-info"></i>add the items to the cart and book now
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
